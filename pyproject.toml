[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolve-skills"
version = "0.1.0"
description = "Shared skills and evolving memory for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jinja2>=3", "mcp>=2", "pydantic>=2", "pyyaml>=6", "rich>=13"]

[project.scripts]
evolva = "evolva.cli:main"

[project.optional-dependencies]
dev = ["pre-commit>=3.7", "pytest>=8", "ruff==0.16.8"]

[tool.setuptools.packages.find]
include = ["evolva*"]

[tool.setuptools.package-data]
"evolva.agents.codex" = ["*.jinja"]
"evolva.agents.claude" = ["*.jinja"]

[tool.ruff]
target-version = "py311"
src = ["evolva", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["evolva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
