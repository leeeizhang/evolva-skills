[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolve-skills"
version = "0.1.0"
description = "Shared skills and evolving memory for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2", "pydantic>=2", "pyyaml>=6", "rich>=13"]

[project.scripts]
evolva = "evolva.cli:main"

[tool.setuptools.packages.find]
include = ["evolva*"]
